# CLI > DISCOVERYX_<UPPERCASE_KEY> > this YAML > built-in defaults.
# tools_dir/templates_dir default to the user's OS cache (LOCALAPPDATA on Windows).
output: runs
port_scan: first
subfinder: on
crawl: on
directory: on
nuclei: on
web_only: false
scan_type: connect
syn_fallback: false
smart_scan: false
service_version: true
ports: top-1000
# Embedded common.txt; set a file path to use your own dictionary.
wordlist: builtin
tech_rules: configs/tech-extensions.yaml
extensions: []
crawl_depth: 3
directory_depth: 3
# 0 omits the corresponding flag and uses the installed tool default.
feroxbuster_scan_limit: 0
# Install missing Nuclei templates once; existing templates are never auto-updated.
template_auto_install: true
tags: cve,vuln,vkev,kev
severity: medium,high,critical
excluded: []
http_timeout: 10s
stage_timeout: 30m
max_duration: 2h
max_targets: 100
log_level: info
limits:
  naabu: {rate: 20, concurrency: 5}
  subfinder: {rate: 10, concurrency: 5}
  dnsx: {rate: 20, concurrency: 5}
  httpx: {rate: 20, concurrency: 5}
  katana: {rate: 20, concurrency: 5}
  feroxbuster: {rate: 0, concurrency: 0}
  nuclei: {rate: 0, concurrency: 0}

# auto runs alongside the web pipeline when a GitHub token is supplied.
ghrecon: auto
ghrecon_profile: standard
ghrecon_max_queries: 50
ghrecon_max_results: 100
ghrecon_concurrency: 4
